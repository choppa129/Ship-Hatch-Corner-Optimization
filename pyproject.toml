[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "hatch-corner-optimization-demo"
version = "0.1.0"
description = "Illustrative open-source 2D finite-element and island-GA demo for hatch-corner geometry"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "scipy>=1.9", "matplotlib>=3.6"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
hatchopt = "hatchopt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
